<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>더벤티 — 매장 찾기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=y8yv8rwtta&submodules=geocoder"></script>
</head>
<body>

  <div class="layout">

    <!-- 사이드바 -->
    <aside class="sidebar">

      <header class="sidebar-header">
        <div class="brand">
          <span class="brand-mark">V</span>
          <div class="brand-text">
            <strong>THE VENTI</strong>
            <span>매장 찾기</span>
          </div>
        </div>
      </header>

      <!-- 검색 -->
      <div class="search-section">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="주소 또는 지역명 검색" autocomplete="off" />
          <button id="searchBtn" aria-label="검색">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </button>
        </div>
        <div class="search-meta" id="searchMeta"></div>
      </div>

      <!-- 지도 타입 전환 -->
      <div class="map-type-toggle">
        <button class="toggle-btn active" data-type="normal" id="typeNormal">일반지도</button>
        <button class="toggle-btn" data-type="satellite" id="typeSatellite">위성지도</button>
      </div>

      <!-- 매장 목록 -->
      <div class="store-list-header">
        <span>전체 매장</span>
        <span class="store-count" id="storeCount">5</span>
      </div>

      <ul class="store-list" id="storeList">
        <!-- JS로 렌더링 -->
      </ul>

    </aside>

    <!-- 지도 -->
    <main class="map-area">
      <div id="map"></div>
    </main>

  </div>

  <script src="custom.js"></script>
</body>
</html>
